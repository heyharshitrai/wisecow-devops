# Single-node kind cluster with two host ports forwarded in.
#
# The node image is pinned by digest. `kind create cluster` with no image would
# silently give me whatever kind's default is that week, which makes the README
# un-reproducible six months from now.
#
# Traffic path: host :80 -> node :30080 -> Traefik NodePort.
# Traefik runs as NodePort rather than LoadBalancer because kind has no cloud
# provider, so a LoadBalancer Service would sit on <pending> forever.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: wisecow
nodes:
  - role: control-plane
    image: kindest/node:v1.34.11@sha256:44e222ee2132dab25ff87301682f89eb82c7880ea3a1bf543bfe9708fd08d67d
    extraPortMappings:
      - containerPort: 30080
        hostPort: 80
        protocol: TCP
      - containerPort: 30443
        hostPort: 443
        protocol: TCP
