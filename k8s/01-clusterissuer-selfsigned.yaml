# Step 1 of the local TLS chain.
#
# A selfSigned issuer can only mint self-signed certificates, so it is not used
# directly on the Ingress. Its job is to sign one thing: the private CA below.
# Browsers will not trust that CA until you import it, but unlike a bare
# self-signed leaf it gives a normal chain, which is what production looks like.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: wisecow-selfsigned
spec:
  selfSigned: {}
